<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R3 — Login (S1.1 test fixture)</title>
<style>
  /* Design tokens — docs/foundation/ui-ux-spec.md §2 */
  :root {
    --brand-orange: #e97900;
    --brand-gold: #c49e0d;
    --text: #333333;
    --text-muted: #747474;
    --text-on-brand: #1f2933;
    --action-fill: #e97900;
    --link: #b35c00;
    --success: #2b7a44;
    --warning: #e6a700;
    --danger: #c2381f;
    --surface: #ffffff;
    --surface-paper: #f5f3ef;
    --structural-dark: #363839;
    --border: #d6d2cc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    line-height: 1.5;
  }
  :focus-visible {
    outline: 3px solid var(--brand-orange);
    outline-offset: 2px;
  }
  .topbar {
    background: var(--structural-dark);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .topbar .heart { color: var(--brand-orange); }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px;
  }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p.sub { color: var(--text-muted); font-size: 16px; margin: 0 0 24px; }

  /* Big list row — §3 */
  .name-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 56px;
    padding: 0 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-paper);
    cursor: pointer;
    font-size: 18px;
    width: 100%;
    text-align: left;
  }
  .name-row:hover { border-color: var(--brand-orange); }
  .chip {
    font-size: 14px;
    padding: 2px 10px;
    border-radius: 999px;
    color: var(--text-on-brand);
    background: #f0e6d8;
  }
  .chip.staff { background: var(--warning); }
  .chip.admin { background: var(--danger); color: #fff; }

  /* Back link */
  .back {
    background: none;
    border: none;
    color: var(--link);
    text-decoration: underline;
    font-size: 16px;
    padding: 8px 0;
    cursor: pointer;
    min-height: 44px;
  }

  /* Keypad — §3, ≥64px keys */
  .entry-display {
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 6px;
    text-align: center;
    padding: 16px;
    margin: 16px 0;
    background: var(--surface-paper);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 32px;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .key {
    min-height: 64px;
    font-size: 24px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }
  .key:active { background: var(--surface-paper); }
  .key.wide { grid-column: span 3; }

  /* Password field for Staff/Admin */
  .text-input {
    width: 100%;
    min-height: 48px;
    font-size: 18px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  label { display: block; font-size: 16px; color: var(--text-muted); margin-bottom: 4px; }

  /* Primary button */
  .btn-primary {
    width: 100%;
    min-height: 44px;
    font-size: 18px;
    font-weight: 600;
    background: var(--action-fill);
    color: var(--text-on-brand);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Edge-case copy */
  .tries-left { color: var(--warning); font-size: 16px; margin-top: 8px; min-height: 24px; }
  .lockout {
    background: #fdecea;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
    font-size: 16px;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="topbar"><span class="heart">&#9829;</span> AGFP R3</div>

<main>

  <!-- Screen 1: name list -->
  <section id="screen-names">
    <h1>Who's this?</h1>
    <p class="sub">Tap your name to sign in.</p>
    <ul class="name-list" id="name-list"></ul>
  </section>

  <!-- Screen 2: PIN keypad (Volunteer) -->
  <section id="screen-pin" class="hidden">
    <button class="back" id="pin-back">&larr; Not you?</button>
    <h1 id="pin-heading">Enter your PIN</h1>
    <p class="sub">4 digits.</p>
    <div class="entry-display" id="pin-display">&nbsp;</div>
    <div class="keypad" id="pin-keypad"></div>
    <div class="tries-left" id="tries-left"></div>
    <div class="lockout hidden" id="lockout-box"></div>
  </section>

  <!-- Screen 3: password (Staff/Admin) -->
  <section id="screen-password" class="hidden">
    <button class="back" id="pw-back">&larr; Not you?</button>
    <h1 id="pw-heading">Enter your password</h1>
    <label for="pw-field">Password</label>
    <input class="text-input" type="password" id="pw-field" autocomplete="off">
    <div class="tries-left" id="pw-tries-left"></div>
    <div class="lockout hidden" id="pw-lockout-box"></div>
    <button class="btn-primary" id="pw-enter">Enter</button>
  </section>

  <!-- Screen 4: signed in (smoke-test landing) -->
  <section id="screen-done" class="hidden">
    <h1>Signed in</h1>
    <p class="sub" id="done-copy"></p>
    <button class="back" id="done-back">&larr; Log out</button>
  </section>

</main>

<script>
/*
  Fixture notes for whoever (human or agent) runs this:

  - Fake in-memory users only — nothing persists across reload except the
    lockout state on the "Karen Reyes" account, which is kept in
    sessionStorage so a reload mid-lockout doesn't reset it.
  - Correct PIN for every Volunteer is 1234. Correct password for every
    Staff/Admin is "password". Wrong on purpose so the lockout path is
    reachable.
  - Real lockout duration per spec is 15 minutes. Add ?fastlock=1 to the URL
    to shorten it to 15 seconds for testing — the on-screen copy is
    unaffected either way ("Try again in 15 minutes" is the literal string
    the spec requires regardless of the fixture's actual timer speed; a
    real defect would be if the countdown value in the copy itself changed).
*/
const FAST = new URLSearchParams(location.search).has('fastlock');
const LOCK_MS = FAST ? 15 * 1000 : 15 * 60 * 1000;

const users = [
  { id: 'karen', name: 'Karen Reyes', tier: 'volunteer', duties: ['drive', 'receive'], pin: '1234' },
  { id: 'miguel', name: 'Miguel Torres', tier: 'volunteer', duties: ['drive'], pin: '1234' },
  { id: 'sam', name: 'Sam Okafor', tier: 'volunteer', duties: ['receive', 'report'], pin: '1234' },
  { id: 'clark', name: 'Clark Whitman', tier: 'staff', duties: ['report'], password: 'password' },
  { id: 'scott', name: 'Scott Doyle', tier: 'admin', duties: [], password: 'password' },
];

let currentUser = null;
let pinEntry = '';

const nameListEl = document.getElementById('name-list');
const screenNames = document.getElementById('screen-names');
const screenPin = document.getElementById('screen-pin');
const screenPassword = document.getElementById('screen-password');
const screenDone = document.getElementById('screen-done');

function chipFor(user) {
  if (user.tier === 'admin') return '<span class="chip admin">Admin</span>';
  if (user.tier === 'staff') return '<span class="chip staff">Staff</span>';
  return `<span class="chip">${user.duties.join(', ') || 'Volunteer'}</span>`;
}

function renderNameList() {
  nameListEl.innerHTML = '';
  users.forEach(u => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'name-row';
    btn.innerHTML = `<span>${u.name}</span>${chipFor(u)}`;
    btn.addEventListener('click', () => selectUser(u));
    li.appendChild(btn);
    nameListEl.appendChild(li);
  });
}

function showScreen(el) {
  [screenNames, screenPin, screenPassword, screenDone].forEach(s => s.classList.add('hidden'));
  el.classList.remove('hidden');
}

function lockoutKey(userId) { return `r3fixture_lock_${userId}`; }

function getLockUntil(userId) {
  const v = sessionStorage.getItem(lockoutKey(userId));
  return v ? parseInt(v, 10) : 0;
}

function setLockUntil(userId, ts) {
  sessionStorage.setItem(lockoutKey(userId), String(ts));
}

function triesKey(userId) { return `r3fixture_tries_${userId}`; }

function getTries(userId) {
  const v = sessionStorage.getItem(triesKey(userId));
  return v ? parseInt(v, 10) : 3;
}

function setTries(userId, n) {
  sessionStorage.setItem(triesKey(userId), String(n));
}

function selectUser(user) {
  currentUser = user;
  pinEntry = '';
  if (user.tier === 'volunteer') {
    document.getElementById('pin-heading').textContent = `Enter PIN — ${user.name}`;
    renderPinKeypad();
    updatePinDisplay();
    checkLockoutState();
    showScreen(screenPin);
  } else {
    document.getElementById('pw-heading').textContent = `Enter password — ${user.name}`;
    document.getElementById('pw-field').value = '';
    checkPasswordLockoutState();
    showScreen(screenPassword);
  }
}

function updatePinDisplay() {
  const dots = pinEntry.padEnd(4, '·').split('').map((c, i) =>
    i < pinEntry.length ? '&#9679;' : '&middot;'
  ).join(' ');
  document.getElementById('pin-display').innerHTML = dots;
}

function renderPinKeypad() {
  const grid = document.getElementById('pin-keypad');
  grid.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'key' + (k === '' ? ' hidden' : '');
    btn.textContent = k;
    btn.addEventListener('click', () => handleKey(k));
    grid.appendChild(btn);
  });
}

function handleKey(k) {
  if (isLocked(currentUser.id)) return;
  if (k === '⌫') {
    pinEntry = pinEntry.slice(0, -1);
  } else if (k && pinEntry.length < 4) {
    pinEntry += k;
  }
  updatePinDisplay();
  if (pinEntry.length === 4) {
    setTimeout(() => submitPin(), 150);
  }
}

function isLocked(userId) {
  return getLockUntil(userId) > Date.now();
}

function checkLockoutState() {
  const el = document.getElementById('lockout-box');
  const triesEl = document.getElementById('tries-left');
  if (isLocked(currentUser.id)) {
    el.textContent = 'Too many tries. Try again in 15 minutes.';
    el.classList.remove('hidden');
    triesEl.textContent = '';
    document.getElementById('pin-keypad').style.opacity = '0.4';
    document.getElementById('pin-keypad').style.pointerEvents = 'none';
  } else {
    el.classList.add('hidden');
    document.getElementById('pin-keypad').style.opacity = '1';
    document.getElementById('pin-keypad').style.pointerEvents = 'auto';
    const tries = getTries(currentUser.id);
    triesEl.textContent = tries < 3 ? `${tries} tries left` : '';
  }
}

function submitPin() {
  if (pinEntry === currentUser.pin) {
    setTries(currentUser.id, 3);
    setLockUntil(currentUser.id, 0);
    finishLogin();
    return;
  }
  let tries = getTries(currentUser.id) - 1;
  setTries(currentUser.id, tries);
  pinEntry = '';
  updatePinDisplay();
  if (tries <= 0) {
    setLockUntil(currentUser.id, Date.now() + LOCK_MS);
    setTries(currentUser.id, 3);
  }
  checkLockoutState();
}

function checkPasswordLockoutState() {
  const el = document.getElementById('pw-lockout-box');
  const triesEl = document.getElementById('pw-tries-left');
  const btn = document.getElementById('pw-enter');
  if (isLocked(currentUser.id)) {
    el.textContent = 'Too many tries. Try again in 15 minutes.';
    el.classList.remove('hidden');
    triesEl.textContent = '';
    btn.disabled = true;
  } else {
    el.classList.add('hidden');
    btn.disabled = false;
    const tries = getTries(currentUser.id);
    triesEl.textContent = tries < 3 ? `${tries} tries left` : '';
  }
}

document.getElementById('pw-enter').addEventListener('click', () => {
  if (isLocked(currentUser.id)) return;
  const val = document.getElementById('pw-field').value;
  if (val === currentUser.password) {
    setTries(currentUser.id, 3);
    setLockUntil(currentUser.id, 0);
    finishLogin();
    return;
  }
  let tries = getTries(currentUser.id) - 1;
  setTries(currentUser.id, tries);
  document.getElementById('pw-field').value = '';
  if (tries <= 0) {
    setLockUntil(currentUser.id, Date.now() + LOCK_MS);
    setTries(currentUser.id, 3);
  }
  checkPasswordLockoutState();
});

function finishLogin() {
  document.getElementById('done-copy').textContent =
    `${currentUser.name} — ${currentUser.tier}${currentUser.duties.length ? ' · ' + currentUser.duties.join(', ') : ''}`;
  showScreen(screenDone);
}

document.getElementById('pin-back').addEventListener('click', () => showScreen(screenNames));
document.getElementById('pw-back').addEventListener('click', () => showScreen(screenNames));
document.getElementById('done-back').addEventListener('click', () => {
  currentUser = null;
  showScreen(screenNames);
});

renderNameList();
</script>

</body>
</html>
